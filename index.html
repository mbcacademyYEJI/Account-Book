<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>처음의 자리</title>
  <meta name="description" content="기억이 없는 아침의 여덟 장면. 선택 하나가 다음 문장을 바꾸고, 여덟 걸음이 동물 하나의 결로 모입니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #101410;
      --bg-2: #171c18;
      --bg-3: #1e2520;
      --ink: #f0e8d8;
      --muted: #b7b09f;
      --faint: #8c8778;
      --line: #2c352f;
      --accent: #c9a56a;
      --accent-2: #8aa37a;
      --shadow: rgba(0, 0, 0, 0.35);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Noto Sans KR", sans-serif;
      background:
        radial-gradient(1200px 500px at 50% -10%, #243028 0%, transparent 62%),
        radial-gradient(800px 420px at 100% 100%, #1a221c 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      line-height: 1.7;
    }

    .page {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 80px;
    }

    h1, h2, h3, .serif { font-family: "Noto Serif KR", serif; }

    .eyebrow {
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--accent);
      margin: 0 0 10px;
    }

    .title {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 700;
      line-height: 1.25;
      margin: 0 0 12px;
    }

    .lede {
      color: var(--muted);
      font-size: 16px;
      margin: 0;
    }

    .panel {
      margin-top: 28px;
      background: color-mix(in srgb, var(--bg-2) 92%, white 8%);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 24px;
    }

    .progress {
      display: flex;
      gap: 6px;
      margin-bottom: 22px;
    }
    .progress span {
      flex: 1;
      height: 3px;
      border-radius: 99px;
      background: var(--line);
    }
    .progress span.on { background: var(--accent); }
    .progress span.done { background: color-mix(in srgb, var(--accent) 55%, var(--line)); }

    .scene-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--faint);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .lead {
      font-family: "Noto Serif KR", serif;
      font-style: italic;
      color: var(--muted);
      margin: 0 0 16px;
    }

    .ask {
      font-family: "Noto Serif KR", serif;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.6;
      margin: 0 0 22px;
    }

    .choices { display: grid; gap: 10px; }

    .choice {
      appearance: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      background: var(--bg-3);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      font: inherit;
      line-height: 1.65;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }
    .choice:hover {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      transform: translateY(-1px);
    }
    .choice.active {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--bg-3) 82%, var(--accent) 18%);
    }
    .choice .mark {
      display: inline-block;
      min-width: 1.6em;
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
    }

    .nav {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button.btn {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      cursor: pointer;
    }
    button.btn:disabled { opacity: 0.4; cursor: default; }
    button.btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #1a160f;
      font-weight: 600;
    }
    button.btn.ghost { color: var(--muted); }

    .intro-actions { margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap; }

    .note {
      margin-top: 18px;
      color: var(--faint);
      font-size: 13px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 22px 0;
    }
    .stat {
      background: var(--bg-3);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .stat b {
      display: block;
      font-size: 22px;
      font-family: "Noto Serif KR", serif;
    }
    .stat span { color: var(--faint); font-size: 12px; }

    .portrait-head { margin-bottom: 8px; }
    .animal {
      font-size: clamp(34px, 7vw, 52px);
      margin: 0;
      line-height: 1.2;
    }
    .epithet {
      margin: 6px 0 0;
      color: var(--accent);
      font-size: 18px;
    }
    .code {
      color: var(--faint);
      font-size: 13px;
      letter-spacing: 0.12em;
      margin-top: 8px;
    }

    .block { margin-top: 22px; }
    .block h2 {
      font-size: 15px;
      letter-spacing: 0.12em;
      color: var(--accent-2);
      margin: 0 0 8px;
    }
    .block p { margin: 0; color: var(--ink); }

    .list {
      margin-top: 16px;
      display: grid;
      gap: 10px;
    }
    .list p { margin: 0; }
    .list strong { color: var(--accent); font-weight: 600; }

    .animals {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .animals button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--bg-3);
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 6px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .animals button.mine {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--bg-3) 80%, var(--accent) 20%);
    }

    .callout {
      margin-top: 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .hidden { display: none; }
    .fade { animation: fade 0.35s ease; }
    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 24px, 720px); padding-top: 24px; }
      .panel { padding: 22px 16px; }
      .ask { font-size: 18px; }
      .stats, .animals { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <main class="page">
    <section id="intro" class="fade">
      <p class="eyebrow">THE FIRST PLACE</p>
      <h1 class="title">처음의 자리</h1>
      <p class="lede">어느 날, 당신은 자신이 여기 있다는 것을 압니다. 이름은 아직 없고, 기억도 없습니다. 여덟 장면마다 가장 가까운 하나를 고르면, 선택 하나가 다음 문장을 바꾸고 걸음이 동물 하나의 결로 모입니다.</p>
      <div class="intro-actions">
        <button class="btn primary" type="button" id="start-btn">첫 장면을 엽니다</button>
        <button class="btn ghost" type="button" id="browse-btn">열여섯 결만 봅니다</button>
      </div>
      <p class="note">옳은 답은 없습니다. 결과는 성향의 기울기이지, 진단이 아닙니다.</p>
    </section>

    <section id="quiz" class="hidden">
      <div class="progress" id="progress" aria-hidden="true"></div>
      <div class="panel fade" id="quiz-panel">
        <div class="scene-meta">
          <span id="scene-label"></span>
          <span id="axis-label"></span>
        </div>
        <p class="lead hidden" id="lead"></p>
        <p class="ask" id="ask"></p>
        <div class="choices" id="choices"></div>
        <div class="nav">
          <button class="btn ghost" type="button" id="prev-btn">이전 장면</button>
        </div>
      </div>
    </section>

    <section id="result" class="hidden">
      <div class="panel fade" id="result-panel"></div>
    </section>
  </main>

  <script>
    const MARKS = ["가", "나", "다", "라"];
    const CODES = [
      "ISTJ", "ISFJ", "INFJ", "INTJ",
      "ISTP", "ISFP", "INFP", "INTP",
      "ESTP", "ESFP", "ENFP", "ENTP",
      "ESTJ", "ESFJ", "ENFJ", "ENTJ"
    ];

    const QUESTIONS = [
      {
        scene: "빈자리",
        axis: "주의 · 밖/안",
        ask: "어느 날, 당신은 자신이 여기 있다는 것을 알았습니다. 공간을 유영하던 당신은 문득, 불러올 기억이 하나도 없다는 것을 깨달았습니다. 이름도, 왔던 곳도, 그리운 얼굴도 없습니다. 그 빈자리에서 먼저 올라오는 마음은 무엇입니까?",
        leads: null,
        choices: [
          { text: "가슴이 뛰고, 누군가 혹은 무언가가 밖에 있기를 바라며 마음이 먼저 나갑니다.", pole: "E", weight: 2 },
          { text: "신기합니다. 이 상태가 무엇인지, 바깥의 반응을 확인해 보고 싶어집니다.", pole: "E", weight: 1 },
          { text: "조용히 가라앉습니다. 서두르지 않고 이 감각을 혼자 충분히 느껴 보고 싶습니다.", pole: "I", weight: 1 },
          { text: "오히려 평온합니다. 비어 있는 안쪽으로 주의가 모여, 자신의 숨이 먼저 들립니다.", pole: "I", weight: 2 }
        ]
      },
      {
        scene: "감은 몸",
        axis: "생활 · 매듭/열어둠",
        ask: "손끝과 무게와 숨만으로, 당신은 어떻게 움직이겠습니까?",
        leads: [
          "밖으로 뛰는 가슴을 안은 채, 당신은 몸을 움직여 보기로 합니다. 아직 눈은 감겨 있습니다.",
          "확인하고 싶은 마음을 안은 채, 당신은 몸을 움직여 보기로 합니다. 아직 눈은 감겨 있습니다.",
          "가라앉은 마음을 깨지 않은 채, 당신은 천천히 몸을 움직여 보기로 합니다. 아직 눈은 감겨 있습니다.",
          "안쪽에 모인 주의를 유지한 채, 당신은 숨을 기준으로 몸을 움직여 보기로 합니다. 아직 눈은 감겨 있습니다."
        ],
        choices: [
          { text: "손가락, 손목, 어깨 순으로 하나씩 움직여, 몸이 어디까지 되는지 확인합니다.", pole: "J", weight: 2 },
          { text: "숨을 고르고 갈 쪽을 정한 다음, 한 걸음만 내딛습니다.", pole: "J", weight: 1 },
          { text: "방향을 정하지 않고, 몸이 기울어지는 쪽으로 팔을 뻗어 따라가 봅니다.", pole: "P", weight: 1 },
          { text: "차례를 만들지 않습니다. 돌고 기울며, 떠오르는 충동마다 몸을 맡겨 봅니다.", pole: "P", weight: 2 }
        ]
      },
      {
        scene: "첫 풍경",
        axis: "인식 · 여기/너머",
        ask: "당신이 눈을 뜨고 처음 보게 된 풍경은 어떤 풍경입니까?",
        leads: [
          "손가락부터 차례로 확인한 뒤, 당신은 눈을 뜹니다. 처음 보는 풍경이 하나 앞에 있습니다.",
          "정한 방향으로 한 걸음을 둔 뒤, 당신은 눈을 뜹니다. 처음 보는 풍경이 하나 앞에 있습니다.",
          "몸이 기울던 쪽에서, 당신은 눈을 뜹니다. 처음 보는 풍경이 하나 앞에 있습니다.",
          "충동을 따라 움직임을 놓은 뒤, 당신은 눈을 뜹니다. 처음 보는 풍경이 하나 앞에 있습니다."
        ],
        choices: [
          { text: "발아래 흙과 풀잎이 하나하나 보이는 들판. 바람의 온도와 발의 무게가 또렷합니다.", pole: "S", weight: 2 },
          { text: "좁고 뚜렷한 오솔길. 다음 한 걸음이 바닥에 이미 놓여 있습니다.", pole: "S", weight: 1 },
          { text: "빛과 안개가 겹친 숲. 보이는 나무보다, 그 뒤에 이어질 공간이 먼저 다가옵니다.", pole: "N", weight: 1 },
          { text: "물결이 수평선에서 사라지는 해변. 발밑의 모래보다 저 너머가 더 크게 느껴집니다.", pole: "N", weight: 2 }
        ]
      },
      {
        scene: "마음의 기울기",
        axis: "판단 · 기준/가치",
        ask: "당신은 어떤 마음이 듭니까?",
        leads: [
          "들판의 풀이 발목에 스칩니다. 바람의 온도가 피부에 남습니다.",
          "오솔길이 발 앞으로 이어집니다. 바닥의 흙이 다음 걸음을 보여 줍니다.",
          "숲의 안개가 시야 끝에 머뭅니다. 나무 뒤의 공간이 아직 말을 걸지 않습니다.",
          "파도가 수평선에서 갈라집니다. 모래보다 먼 선이 더 크게 남습니다."
        ],
        choices: [
          { text: "차분해집니다. 이곳이 어떻게 이루어져 있는지, 사실부터 가려 보고 싶습니다.", pole: "T", weight: 2 },
          { text: "긴장이 옵니다. 머무를지 움직일지, 이유와 결과를 따져 정하고 싶습니다.", pole: "T", weight: 1 },
          { text: "마음의 온도가 먼저입니다. 이 자리가 나를 받아 주는지가 알고 싶습니다.", pole: "F", weight: 1 },
          { text: "마음이 쓰입니다. 어딘가의 작은 생명이 다치지 않기를, 그것부터 헤아리고 싶습니다.", pole: "F", weight: 2 }
        ]
      },
      {
        scene: "기척",
        axis: "주의 · 밖/안",
        ask: "당신과 같은 숨은 아닌데, 멀지 않은 곳에서 온기가 움직입니다. 당신은 어떻게 합니까?",
        leads: [
          "사실을 가려 보려는 마음이 자리 잡을 무렵, 풍경 안에 기척이 있습니다.",
          "이유를 따지려는 긴장이 남은 채, 풍경 안에 기척이 있습니다.",
          "마음의 온도를 살피던 당신에게, 풍경 안의 기척이 먼저 닿습니다.",
          "작은 생명을 헤아리던 마음에, 멀지 않은 온기가 응답하듯 움직입니다."
        ],
        choices: [
          { text: "망설이지 않고 그쪽으로 걸어가, 자신이 여기 있음을 알립니다.", pole: "E", weight: 2 },
          { text: "거리를 조금 좁히고, 상대가 반응하는지를 살피며 가까이 갑니다.", pole: "E", weight: 1 },
          { text: "자리를 지키며 지켜봅니다. 충분히 알 때까지 먼저 나서지 않습니다.", pole: "I", weight: 1 },
          { text: "한 걸음 물러나 공간을 남겨 둡니다. 다가가기보다 그 기척을 듣는 쪽이 편합니다.", pole: "I", weight: 2 }
        ]
      },
      {
        scene: "표식",
        axis: "인식 · 여기/너머",
        ask: "젖은 발자국, 꺾인 풀, 그리고 설명되지 않는 방향. 당신은 그 표식을 어떻게 읽습니까?",
        leads: [
          "당신이 다가가 자신이 여기 있음을 알리자, 기척은 모습을 다 보여 주지 않고 표식만 남깁니다.",
          "거리를 좁혀 반응을 살피자, 기척은 모습을 다 보여 주지 않고 표식만 남깁니다.",

        choices: [

          { text: "흙을 만지고 온도를 비교하며, 방금 전에 있었던 일을 조각조각 조립합니다.", pole: "S", weight: 1 },
          { text: "표식은 실마리일 뿐입니다. 그것들이 가리키는 이야기가 더 또렷합니다.", pole: "N", weight: 1 },
          { text: "증거보다 먼저, 이유 없이 선명해지는 방향이 있습니다. 그 끌림을 따릅니다.", pole: "N", weight: 2 }
        ]
      },
      {
        scene: "갈림길",
        axis: "판단 · 기준/가치",
        ask: "한쪽은 짧고 뚜렷하여 이 세계의 끝에 곧 닿을 듯합니다. 다른 쪽은 돌아가지만, 그 끝에 힘이 빠진 작은 숨이 있습니다. 그대로 두면 곧 사라질 것 같습니다. 당신은 어느 쪽을 택합니까?",
        leads: [
          "보이는 단서를 따라가자, 길이 둘로 갈라집니다.",
          "흙의 온도로 일을 조립하자, 길이 둘로 갈라집니다.",
          "표식 뒤의 이야기를 읽자, 길이 둘로 갈라집니다.",
          "끌림을 따라가자, 길이 둘로 갈라집니다."
        ],
        choices: [
          { text: "짧고 뚜렷한 길입니다. 세계의 구조를 알아야 무엇도 도울 수 있습니다.", pole: "T", weight: 2 },

        code += letter;
        axes.push({
          name: axis.name,
          letter,
          clarity: diff >= 4 ? "선명" : diff >= 2 ? "기울어짐" : "경계",
          leftName: axis.leftName,
          rightName: axis.rightName,
          leftPts,
          rightPts
        });
      }
      return { code, axes };
    }

    function renderProgress() {
      els.progress.innerHTML = QUESTIONS.map((_, i) => {
        const cls = i === state.step ? "on" : i < state.step || state.answers[i] >= 0 ? "done" : "";
        return `<span class="${cls}"></span>`;
      }).join("");
    }

    function renderQuestion() {
      const q = QUESTIONS[state.step];
      const prevAnswer = state.step > 0 ? state.answers[state.step - 1] : -1;
      const lead = q.leads && prevAnswer >= 0 ? q.leads[prevAnswer] : "";
      els.scene.textContent = `장면 ${state.step + 1} / 8 · ${q.scene}`;
      els.axis.textContent = q.axis;
      els.ask.textContent = q.ask;
      els.lead.textContent = lead;
      els.lead.classList.toggle("hidden", !lead);
      els.prev.disabled = state.step === 0;
      els.choices.innerHTML = q.choices.map((choice, index) => {
        const active = state.answers[state.step] === index ? " active" : "";
        return `<button class="choice${active}" type="button" data-index="${index}"><span class="mark">${MARKS[index]}</span>${choice.text}</button>`;
      }).join("");
      renderProgress();
      replay(els.panel);
    }

    function portraitHTML(code, axes, heading, scoredCode) {
      const p = PORTRAITS[code];
      const stats = axes ? `<div class="stats">${axes.map((axis) => `
        <div class="stat">
          <b>${axis.letter}</b>
          <span>${axis.name} · ${axis.clarity} · ${axis.leftName} ${axis.leftPts} / ${axis.rightName} ${axis.rightPts}</span>
        </div>`).join("")}</div>` : "";
      const chips = CODES.map((c) => {
        const mine = scoredCode && c === scoredCode ? " mine" : "";
        const current = c === code ? " mine" : "";
        return `<button type="button" class="${mine || current}" data-code="${c}">${PORTRAITS[c].animal}<br>${c}</button>`;
      }).join("");
      return `
        <p class="eyebrow">${heading}</p>
        <div class="portrait-head">
          <h1 class="animal">${p.animal}</h1>
          <p class="epithet serif">${p.epithet}</p>
          <p class="code">${code}</p>
        </div>
        ${stats}
        <div class="block">
          <h2>아침</h2>
          <p>${p.ending}</p>
        </div>
        <div class="block">
          <h2>해석</h2>
          <p>${p.read}</p>
        </div>
        <div class="list">
          <p><strong>강점.</strong> ${p.gift}</p>
          <p><strong>그늘.</strong> ${p.edge}</p>
          <p><strong>다음 걸음.</strong> ${p.grow}</p>
        </div>
        <div class="block">
          <h2>열여섯 결</h2>
          <div class="animals">${chips}</div>
        </div>
        <div class="callout">여덟 장면의 단축입니다. 경계로 나온 축은 답 하나에 글자가 바뀔 수 있습니다. 사람을 고르거나 진단하는 도구로 쓰지 않습니다.</div>
        <div class="nav">
          <button class="btn primary" type="button" id="restart-btn">${scoredCode ? "처음부터" : "이야기로 돌아가기"}</button>
          ${scoredCode ? `<button class="btn ghost" type="button" id="back-last-btn">마지막 장면</button>` : ""}
        </div>
      `;
    }

    function renderResult(code, axes) {
      state.viewCode = code;
      els.resultPanel.innerHTML = portraitHTML(code, axes, state.scoredCode ? "당신의 아침" : "이 결의 아침", state.scoredCode);
      replay(els.resultPanel);
      show("result");
    }

    function choose(index) {
      state.answers[state.step] = index;
      if (state.step >= 7) {
        const scored = scoreAll(state.answers);
        state.scoredCode = scored.code;
        renderResult(scored.code, scored.axes);
        return;
      }
      state.step += 1;
      renderQuestion();
    }

    function startQuiz() {
      state.step = 0;
      state.answers = [-1, -1, -1, -1, -1, -1, -1, -1];
      state.scoredCode = null;
      renderQuestion();
      show("quiz");
    }

    document.getElementById("start-btn").addEventListener("click", startQuiz);
    document.getElementById("browse-btn").addEventListener("click", () => {
      state.scoredCode = null;
      renderResult("INFJ", null);
    });
    els.prev.addEventListener("click", () => {
      if (state.step === 0) return;
      state.step -= 1;
      renderQuestion();
    });
    els.choices.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-index]");
      if (!button) return;
      choose(Number(button.dataset.index));
    });
    els.resultPanel.addEventListener("click", (event) => {
      const chip = event.target.closest("button[data-code]");
      if (chip) {
        const scored = state.scoredCode ? scoreAll(state.answers) : null;
        const code = chip.dataset.code;
        const axes = scored && scored.code === code ? scored.axes : null;
        els.resultPanel.innerHTML = portraitHTML(code, axes, scored && scored.code === code ? "당신의 아침" : "이 결의 아침", state.scoredCode);
        replay(els.resultPanel);
        return;
      }
      if (event.target.id === "restart-btn") {
        if (state.scoredCode) startQuiz();
        else show("intro");
        return;
      }
      if (event.target.id === "back-last-btn") {
        state.step = 7;
        renderQuestion();
        show("quiz");
      }
    });
  </script>
</body>
</html>
